<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Country Handbooks — Josiah Venture</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%239E2B3F'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='34' font-weight='700' fill='%23fff' text-anchor='middle'%3EJV%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
 --bg1:#F7F4EE;--bg2:#EFEAE0;--card:#FFFFFF;--ink:#211E19;--soft:#6E675B;--faint:#A49A88;
 --line:#E7E1D5;--accent:#9E2B3F;--accent2:#7C1F30;
 --green:#1B7565;--amber:#B4741A;--grey:#9A9284;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;color:var(--ink);font-family:Archivo,system-ui,sans-serif;font-size:15px;line-height:1.5;
 background:radial-gradient(1200px 600px at 80% -5%,#FBF9F4 0%,rgba(251,249,244,0) 60%),linear-gradient(180deg,var(--bg1),var(--bg2));
 background-attachment:fixed;padding-bottom:80px}
.wrap{max-width:1120px;margin:0 auto;padding:0 26px}
.hero{padding:60px 0 30px}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;
 text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:20px}
.eyebrow .mono{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;
 font-family:Georgia,serif;font-size:14px;font-weight:700;letter-spacing:0}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(34px,6vw,58px);letter-spacing:-.02em;line-height:1.02}
.sub{margin-top:16px;color:var(--soft);max-width:56ch;font-size:16.5px;line-height:1.55}
.bar{margin-top:24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.link{font-size:13.5px;font-weight:600;color:var(--accent);text-decoration:none;border-bottom:1.5px solid transparent;padding-bottom:1px}
.link:hover{border-bottom-color:var(--accent)}
.count{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.06em;color:var(--faint)}
.rule{height:1px;background:linear-gradient(90deg,var(--line),rgba(231,225,213,0));margin:6px 0 26px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(208px,1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:12px;
 padding:14px 15px;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(40,30,20,.04);
 transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(40,30,20,.10);border-color:#DAD2C4}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--grey)}
.card.s-progress::before{background:var(--amber)}
.card.s-live::before{background:var(--green)}
.chead{display:flex;align-items:center;gap:10px}
.flag{font-size:23px;line-height:1;flex:0 0 auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.1))}
.cname{font-weight:600;font-size:15.5px;letter-spacing:-.01em;line-height:1.15;flex:1;min-width:0}
.arrow{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--faint);transition:color .16s,transform .16s;flex:0 0 auto}
.card:hover .arrow{color:var(--accent);transform:translateX(2px)}
.pill{align-self:flex-start;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
 font-weight:500;padding:3px 9px;border-radius:99px;background:#F2EEE6;color:var(--soft);border:1px solid var(--line)}
.prog{height:6px;border-radius:99px;background:#EBE4D7;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px}
.pnum{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.02em;color:var(--soft)}
.pnum b{color:var(--ink);font-weight:600}
.msg{font-size:13px;color:var(--faint);margin:-8px 0 20px;min-height:16px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="wrap">
<header class="hero">
 <div class="eyebrow"><span class="mono">JV</span> Josiah Venture · Staff Handbook System</div>
 <h1>Country handbooks</h1>
 <p class="sub">Each national organization shapes its own staff handbook from the shared 104-section master — in its own language. Choose a country to open its builder.</p>
 <div class="bar">
  <a class="link" href="/register">Oversight register →</a>
  <span class="count" id="count"></span>
 </div>
</header>
<div class="rule"></div>
<div class="msg" id="msg"></div>
<div class="cards" id="cards"></div>
</div>
<script>
const CNAT={Albania:"Shqipëria",Bulgaria:"България",Croatia:"Hrvatska","Czech Republic":"Česká republika",
 Estonia:"Eesti",Germany:"Deutschland",Hungary:"Magyarország",Latvia:"Latvija",Moldova:"Moldova",
 Montenegro:"Crna Gora",Poland:"Polska",Romania:"România",Serbia:"Србија",Slovakia:"Slovensko",
 Slovenia:"Slovenija",Ukraine:"Україна"};
const FLAG={Albania:"🇦🇱",Bulgaria:"🇧🇬",Croatia:"🇭🇷","Czech Republic":"🇨🇿",Estonia:"🇪🇪",Germany:"🇩🇪",
 Hungary:"🇭🇺",Latvia:"🇱🇻",Moldova:"🇲🇩",Montenegro:"🇲🇪",Poland:"🇵🇱",Romania:"🇷🇴",Serbia:"🇷🇸",
 Slovakia:"🇸🇰",Slovenia:"🇸🇮",Ukraine:"🇺🇦"};
const FALLBACK=Object.keys(CNAT).map(c=>({country:c,org:"",ctl:"",status:"",nextReview:""}));
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function scls(status){const s=(status||"").toLowerCase();
 if(/review|progress|draft|adopt/.test(s))return"review";
 if(/publish|live|current|complete|done/.test(s))return"live";
 return"none";}
function fmtDate(d){if(!d)return"";const t=new Date(d);return isNaN(t)?"":t.toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"});}
function card(c){
 const total=c.total||0,done=c.done||0,toGo=Math.max(0,total-done);
 const set=total>0,full=set&&done>=total;
 const cls=!set?"none":(full?"live":"progress");
 const flag=FLAG[c.country]||"🏳️";
 const body=set
  ? `<div class="prog" role="img" aria-label="${done} of ${total} done"><i style="width:${Math.round(done/total*100)}%"></i></div>
     <div class="pnum"><span><b>${done}</b> done</span><span>${toGo} to go</span></div>`
  : `<span class="pill">Not set up</span>`;
 return `<a class="card s-${cls}" href="/build?country=${encodeURIComponent(c.country)}">
  <div class="chead"><span class="flag">${flag}</span><span class="cname">${esc(c.country)}</span><span class="arrow">→</span></div>
  ${body}
 </a>`;
}
function draw(list){document.getElementById("cards").innerHTML=list.map(card).join("");
 document.getElementById("count").textContent=list.length+" national organizations";}
draw(FALLBACK);
(async()=>{
 const msg=document.getElementById("msg");
 try{
  const res=await fetch("/api?action=countries");
  const j=await res.json();
  if(!res.ok||j.error)throw new Error(j.error||("HTTP "+res.status));
  if(Array.isArray(j.countries)&&j.countries.length){draw(j.countries);msg.textContent="Live status from Airtable.";}
 }catch(e){ msg.textContent="Showing the standard roster — live status loads once the site is deployed with AIRTABLE_TOKEN set."; }
})();
</script></body></html>
