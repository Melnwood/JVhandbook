[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# index.html IS the all-countries landing page — served at "/" automatically,
# no redirect needed (a "/" redirect would be shadowed by the real file anyway).

[[redirects]]
  from = "/countries"
  to = "/index.html"
  status = 200

# The oversight register (moved off "/")
[[redirects]]
  from = "/register"
  to = "/register.html"
  status = 200

[[redirects]]
  from = "/build"
  to = "/builder.html"
  status = 200

# The Airtable proxy
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/airtable"
  status = 200

# The AI proxy (drafting + translation)
[[redirects]]
  from = "/ai"
  to = "/.netlify/functions/ai"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
